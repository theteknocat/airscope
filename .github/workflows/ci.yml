name: Checks

# Formatting, lints and tests on every push and pull request, so they are not first checked when a release tag is pushed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04 # same as the release build
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
